<div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
  <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200">
    <h2 class="text-xl font-semibold text-gray-900">Recent Submissions</h2>

    <button class="text-gray-500 hover:text-gray-700">
      <fa-icon [icon]="faEllipsisVertical"></fa-icon>
    </button>
  </div>

  <div class="divide-y divide-gray-200">
    @for (item of submissions; track item.sampleId) {
      <div class="px-5 py-4">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <h3 class="font-medium text-gray-900 leading-5">
              {{ item.sampleId }} - {{ item.testName }}
            </h3>

            <p class="text-sm text-gray-500 mt-1">
              Patient: {{ item.patient }}
            </p>
          </div>

          <span class="text-[11px] font-bold px-2.5 py-1 rounded-md whitespace-nowrap"
                [class]="item.statusClass">
            {{ item.status }}
          </span>
        </div>
      </div>
    }
  </div>
</div>
