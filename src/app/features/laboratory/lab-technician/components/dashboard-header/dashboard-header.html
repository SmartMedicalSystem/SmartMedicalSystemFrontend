<div class="flex justify-between items-start mb-8">

    <!-- Left -->

    <div>

        <h1 class="text-5xl font-bold text-gray-900">

            Lab Technician Dashboard

        </h1>

        <p class="text-gray-500 text-lg mt-3">

            Active Lab Session:

            <span class="font-semibold text-gray-700">

                Morning Shift B-2

            </span>

        </p>

    </div>

    <!-- Right -->

    <div class="flex gap-4">

        <button
            class="flex items-center gap-3 bg-white border border-gray-300 rounded-xl px-6 py-3 hover:bg-gray-100 transition">

            <fa-icon [icon]="exportIcon"></fa-icon>

            Export Report

        </button>

        <button
            class="flex items-center gap-3 bg-[#005EB8] text-white rounded-xl px-6 py-3 hover:bg-blue-700 transition">

            <fa-icon [icon]="aiIcon"></fa-icon>

            Run AI Bulk Scan

        </button>

    </div>

</div>
