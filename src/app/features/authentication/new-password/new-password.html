<div
  [formGroup]="newPasswordForm"
  class="min-h-screen flex flex-col items-center justify-center px-4"
>
  <div class="text-center mb-1">
    <h1 class="mt-4 text-3xl font-bold text-primary">Shefaa Enterprise</h1>
    <p class="text-gray-500 text-xl">Clinical Decision Support Portal</p>
  </div>
  <!-- Card -->
  <div class="w-full mb-1 max-w-md bg-white rounded-2xl shadow-xl p-8">
    <h2 class="text-2xl font-medium text-gray-800">Reset Password</h2>

    <p class="text-md text-gray-600 mt-1">
      Please choose a secure password for your clinical account.
    </p>

    <!-- Password -->
    <div class="mt-5">
      <label class="text-md font-medium text-gray-700">New Password</label>

      <div class="mt-2 flex items-center rounded-xl border px-4 py-3">
        <i class="fa-solid fa-lock mr-3 text-xl text-primary"></i>

        <input
          type="password"
          formControlName="password"
          #inp_P
          placeholder="Enter new password"
          class="w-full outline-none"
        />

        <button type="button" (click)="togglePassword()">
          <i class="fa-regular fa-eye-slash" #eye_P></i>
        </button>
      </div>

      <div class="mt-4 grid grid-cols-2 gap-y-3 text-sm">
        <!-- Min Length -->
        <div class="flex items-center gap-2">
          <div
            class="h-4 w-4 rounded-full border-2"
            [ngClass]="{
              'border-gray-400': !passwordInteracted,
              'border-red-500 bg-red-500': passwordInteracted && minLengthError,
              'border-green-500 bg-green-500': passwordInteracted && !minLengthError,
            }"
          ></div>

          <span
            [ngClass]="{
              'text-gray-600': !passwordInteracted,
              'text-red-500': passwordInteracted && minLengthError,
              'text-green-600': passwordInteracted && !minLengthError,
            }"
          >
            At least 8 characters
          </span>
        </div>

        <!-- Number -->
        <div class="flex items-center gap-2">
          <div
            class="h-4 w-4 rounded-full border-2"
            [ngClass]="{
              'border-gray-400': !passwordInteracted,
              'border-red-500 bg-red-500': passwordInteracted && numberError,
              'border-green-500 bg-green-500': passwordInteracted && !numberError,
            }"
          ></div>

          <span
            [ngClass]="{
              'text-gray-600': !passwordInteracted,
              'text-red-500': passwordInteracted && numberError,
              'text-green-600': passwordInteracted && !numberError,
            }"
          >
            Numbers
          </span>
        </div>

        <!-- Upper & Lower -->
        <div class="flex items-center gap-2">
          <div
            class="h-4 w-4 rounded-full border-2"
            [ngClass]="{
              'border-gray-400': !passwordInteracted,
              'border-red-500 bg-red-500': passwordInteracted && upperLowerError,
              'border-green-500 bg-green-500': passwordInteracted && !upperLowerError,
            }"
          ></div>

          <span
            [ngClass]="{
              'text-gray-600': !passwordInteracted,
              'text-red-500': passwordInteracted && upperLowerError,
              'text-green-600': passwordInteracted && !upperLowerError,
            }"
          >
            Upper & Lower case
          </span>
        </div>

        <!-- Special Character -->
        <div class="flex items-center gap-2">
          <div
            class="h-4 w-4 rounded-full border-2"
            [ngClass]="{
              'border-gray-400': !passwordInteracted,
              'border-red-500 bg-red-500': passwordInteracted && specialError,
              'border-green-500 bg-green-500': passwordInteracted && !specialError,
            }"
          ></div>

          <span
            [ngClass]="{
              'text-gray-600': !passwordInteracted,
              'text-red-500': passwordInteracted && specialError,
              'text-green-600': passwordInteracted && !specialError,
            }"
          >
            Special Character
          </span>
        </div>
      </div>
    </div>

    <!-- Confirm Password -->
    <div class="mt-5">
      <label class="text-md font-medium text-gray-700"> Confirm New Password </label>
      <div class="mt-2 flex items-center rounded-xl border px-4 py-3">
        <i class="fa-solid fa-shield-alt mr-3 text-xl text-primary"></i>
        <input
          type="password"
          formControlName="confirmPassword"
          #inp_C
          placeholder="Re-type new password"
          class="w-full outline-none"
        />
        <button type="button" (click)="toggleConfirmPassword()">
          <i class="fa-regular fa-eye-slash" #eye_C></i>
        </button>
      </div>
      <div class="mt-4 grid gap-y-3 text-sm">
        <!-- Match -->
        <div class="flex items-center gap-2">
          <div
            class="h-4 w-4 rounded-full border-2 border-gray-400"
            [ngClass]="{
              'border-gray-400': !confirmPassword?.value,
              'border-red-500': confirmPassword?.value && !passwordsMatch,
              'bg-green-500 border-green-500': passwordsMatch,
            }"
          ></div>
          <span
            [ngClass]="{
              'text-gray-600': !confirmPassword?.value,
              'text-red-500': confirmPassword?.value && !passwordsMatch,
              'text-green-600': passwordsMatch,
            }"
          >
            Passwords must match
          </span>
        </div>
      </div>
    </div>
    <!-- Button -->

    <button
      [disabled]="isLoading() || newPasswordForm.invalid"
      class="disabled:hover:cursor-default disabled:hover:bg-primary w-full mt-6 flex items-center justify-center gap-1 cursor-pointer bg-primary hover:bg-blue-800 text-neutral py-3 rounded-xl font-medium shadow-lg transition"
      (click)="update()"
    >
      @if (isLoading()) {
        Updating...
      } @else {
        Update Password <i class="fa-solid fa-arrow-right"></i>
      }
    </button>

    <div class="mt-4 text-center">
      <p class="text-xs text-gray-400">© 2026 Shefaa Systems. Unauthorized access is prohibited.</p>
    </div>
  </div>
</div>
