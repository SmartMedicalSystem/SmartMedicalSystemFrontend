<div class="min-h-screen bg-[var(--color-neutral)] p-6">

  <!-- Page Title -->

  <div class="mb-6">

    <h1 class="text-3xl font-bold text-slate-800">
      My Profile
    </h1>

    <p class="text-gray-500 mt-1">
      View and update your personal and professional information within the LabNexus clinical ecosystem.
    </p>

  </div>

  <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">

    <!-- Left Card -->

    <div
      class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">

      <div class="flex flex-col items-center">

        <div class="relative">

          <img
            src="https://i.pravatar.cc/180?img=32"
            class="w-32 h-32 rounded-full object-cover border-4 border-white shadow">

          <button
            class="absolute bottom-0 right-0 w-10 h-10 rounded-full bg-[var(--color-primary)] text-white">

            <i class="fa-solid fa-camera"></i>

          </button>

        </div>

        <h2 class="text-2xl font-bold mt-4">

          Alex Rivera

        </h2>

        <p class="text-gray-500">

          LAB-2024-0512

        </p>

        <span
          class="mt-4 px-4 py-1 rounded-full bg-green-100 text-green-700 text-sm font-semibold">

          <i class="fa-solid fa-circle mr-1 text-xs"></i>

          Active Status

        </span>

      </div>

      <hr class="my-6">

      <div class="space-y-5">

        <div class="flex gap-3">

          <i
            class="fa-solid fa-building text-[var(--color-primary)] mt-1"></i>

          <div>

            <p class="text-xs text-gray-500">

              Assigned Laboratory

            </p>

            <h4 class="font-semibold">

              Central Hematology Lab

            </h4>

          </div>

        </div>

        <div class="flex gap-3">

          <i
            class="fa-solid fa-calendar-days text-[var(--color-primary)] mt-1"></i>

          <div>

            <p class="text-xs text-gray-500">

              Joining Date

            </p>

            <h4 class="font-semibold">

              January 15, 2021

            </h4>

          </div>

        </div>

      </div>

    </div>

    <!-- Right Side -->

    <div
      class="xl:col-span-3 bg-white rounded-xl shadow-sm border border-gray-200 p-8">

      <!-- Personal -->

      <div>

        <h2
          class="text-xl font-bold flex items-center gap-2 mb-6">

          <i
            class="fa-solid fa-user text-[var(--color-primary)]"></i>

          Personal Information

        </h2>

        <div
          class="grid grid-cols-1 md:grid-cols-2 gap-6">

          <div>

            <label
              class="text-sm text-gray-500">

              First Name

            </label>

            <input
              [(ngModel)]="profile.firstName"
              class="w-full border rounded-lg p-3 mt-2 outline-none focus:ring-2 focus:ring-[var(--color-primary)]">

          </div>

          <div>

            <label
              class="text-sm text-gray-500">

              Last Name

            </label>

            <input
              [(ngModel)]="profile.lastName"
              class="w-full border rounded-lg p-3 mt-2 outline-none focus:ring-2 focus:ring-[var(--color-primary)]">

          </div>

          <div>

            <label
              class="text-sm text-gray-500">

              Gender

            </label>

            <select
              [(ngModel)]="profile.gender"
              class="w-full border rounded-lg p-3 mt-2">

              <option>Male</option>

              <option>Female</option>

            </select>

          </div>

          <div>

            <label
              class="text-sm text-gray-500">

              Date of Birth

            </label>

            <input
              type="date"
              [(ngModel)]="profile.birthDate"
              class="w-full border rounded-lg p-3 mt-2">

          </div>

          <div>

            <label
              class="text-sm text-gray-500">

              Nationality

            </label>

            <input
              [(ngModel)]="profile.nationality"
              class="w-full border rounded-lg p-3 mt-2">

          </div>

          <div>

            <label
              class="text-sm text-gray-500">

              National ID

            </label>

            <input
              [(ngModel)]="profile.nationalId"
              class="w-full border rounded-lg p-3 mt-2">

          </div>

        </div>

      </div>

      <hr class="my-10">
      <!-- Professional Information -->

      <div>

        <h2
          class="text-xl font-bold flex items-center gap-2 mb-6">

          <i class="fa-solid fa-briefcase text-[var(--color-primary)]"></i>

          Professional Information

        </h2>

        <div
          class="grid grid-cols-1 md:grid-cols-2 gap-6">

          <div>

            <label class="text-sm text-gray-500">

              Employee ID

            </label>

            <input
              [(ngModel)]="profile.employeeId"
              readonly
              class="w-full mt-2 p-3 rounded-lg border bg-gray-100">

          </div>

          <div>

            <label class="text-sm text-gray-500">

              Assigned Laboratory

            </label>

            <input
              [(ngModel)]="profile.lab"
              readonly
              class="w-full mt-2 p-3 rounded-lg border bg-gray-100">

          </div>

          <div>

            <label class="text-sm text-gray-500">

              Job Title

            </label>

            <input
              [(ngModel)]="profile.jobTitle"
              readonly
              class="w-full mt-2 p-3 rounded-lg border bg-gray-100">

          </div>

          <div>

            <label class="text-sm text-gray-500">

              Years of Experience

            </label>

            <input
              type="number"
              [(ngModel)]="profile.experience"
              class="w-full mt-2 p-3 rounded-lg border">

          </div>

        </div>

      </div>

      <hr class="my-10">

      <!-- Contact Information -->

      <div>

        <h2
          class="text-xl font-bold flex items-center gap-2 mb-6">

          <i class="fa-solid fa-address-card text-[var(--color-primary)]"></i>

          Contact Information

        </h2>

        <div
          class="grid grid-cols-1 md:grid-cols-2 gap-6">

          <div>

            <label class="text-sm text-gray-500">

              Email Address

            </label>

            <input
              type="email"
              [(ngModel)]="profile.email"
              class="w-full mt-2 p-3 rounded-lg border">

          </div>

          <div>

            <label class="text-sm text-gray-500">

              Phone Number

            </label>

            <input
              [(ngModel)]="profile.phone"
              class="w-full mt-2 p-3 rounded-lg border">

          </div>

          <div class="md:col-span-2">

            <label class="text-sm text-gray-500">

              Address

            </label>

            <textarea

              rows="3"

              [(ngModel)]="profile.address"

              class="w-full mt-2 p-3 rounded-lg border resize-none">

            </textarea>

          </div>

        </div>

      </div>

      <hr class="my-10">

      <!-- Buttons -->

      <div
        class="flex flex-col sm:flex-row justify-end gap-4">

       <button
  (click)="cancel()"
  class="px-6 py-3 rounded-lg border hover:bg-gray-100">

  Cancel

</button>

<button
  (click)="saveProfile()"
  class="px-6 py-3 rounded-lg text-white bg-[var(--color-primary)] hover:opacity-90">

  <i class="fa-solid fa-floppy-disk mr-2"></i>

  Save Changes

</button>

      </div>

    </div>

  </div>

</div>
