<div class="flex flex-col lg:flex-row lg:justify-between lg:items-start gap-6 mb-8">
  <!-- Left -->
  <div>
    <h1 class="text-3xl md:text-4xl xl:text-5xl font-bold text-gray-900 leading-tight">
      Lab Technician Dashboard
    </h1>

    <p class="text-gray-500 text-base md:text-lg mt-3">
      Active Lab Session:
      <span class="font-semibold text-gray-700"> Morning Shift B-2 </span>
    </p>
  </div>

  <!-- Right -->
  <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 w-full lg:w-auto">
    <button
      class="flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-xl px-6 py-3 hover:bg-gray-100 transition w-full sm:w-auto"
    >
      <fa-icon [icon]="exportIcon"></fa-icon>
      Export Report
    </button>

    <button
      class="flex items-center justify-center gap-3 bg-primary text-white rounded-xl px-6 py-3 hover:bg-blue-700 transition w-full sm:w-auto"
    >
      <fa-icon [icon]="aiIcon"></fa-icon>
      Run AI Bulk Scan
    </button>
  </div>
</div>
