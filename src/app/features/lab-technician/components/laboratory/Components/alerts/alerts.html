<div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
  <!-- Header -->
  <div
    class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 px-4 md:px-5 py-4 border-b border-gray-200"
  >
    <div class="flex items-center gap-3">
      <fa-icon [icon]="faBell" class="text-gray-700"></fa-icon>

      <h2 class="text-lg md:text-xl font-semibold text-gray-900">Lab Insights &amp; Alerts</h2>
    </div>

    <button class="self-start sm:self-auto text-blue-600 text-sm font-medium hover:underline">
      View All
    </button>
  </div>

  <!-- Alerts -->
  <div class="divide-y divide-gray-200">
    @for (item of alerts; track item.title) {
      <div class="px-4 md:px-5 py-4 flex gap-3 md:gap-4">
        <div
          [class]="
            item.iconBg +
            ' w-10 h-10 md:w-11 md:h-11 rounded-full flex items-center justify-center shrink-0'
          "
        >
          <fa-icon [icon]="item.icon" [class]="item.iconColor"> </fa-icon>
        </div>

        <div class="flex-1 min-w-0">
          <h3 class="font-medium text-sm md:text-base text-gray-900 leading-5 break-words">
            {{ item.title }}
          </h3>

          <p class="text-sm text-gray-600 mt-1 leading-5 break-words">
            {{ item.description }}
          </p>

          @if (item.description2) {
            <p class="text-sm text-gray-600 leading-5 break-words">
              {{ item.description2 }}
            </p>
          }

          <p class="text-xs text-gray-400 mt-2 font-medium">
            {{ item.time }}
          </p>
        </div>
      </div>
    }
  </div>
</div>
