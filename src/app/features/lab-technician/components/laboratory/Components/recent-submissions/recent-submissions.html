<div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
  <!-- Header -->
  <div class="flex items-center justify-between px-4 md:px-5 py-4 border-b border-gray-200">
    <h2 class="text-lg md:text-xl font-semibold text-gray-900">Recent Submissions</h2>

    <button class="text-gray-500 hover:text-gray-700 shrink-0">
      <fa-icon [icon]="faEllipsisVertical"></fa-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="divide-y divide-gray-200">
    @for (item of submissions; track item.sampleId) {
      <div class="px-4 md:px-5 py-4">
        <div class="flex items-start justify-between gap-3 md:gap-4">
          <div class="min-w-0 flex-1">
            <h3 class="font-medium text-sm md:text-base text-gray-900 leading-5 break-words">
              {{ item.sampleId }} - {{ item.testName }}
            </h3>

            <p class="text-xs md:text-sm text-gray-500 mt-1 break-words">
              Patient: {{ item.patient }}
            </p>
          </div>

          <span
            class="text-[10px] md:text-[11px] font-bold px-2.5 py-1 rounded-md whitespace-nowrap shrink-0"
            [class]="item.statusClass"
          >
            {{ item.status }}
          </span>
        </div>
      </div>
    }
  </div>
</div>
