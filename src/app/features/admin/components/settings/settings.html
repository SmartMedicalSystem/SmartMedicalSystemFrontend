<div class="min-h-screen bg-neutral">
  <!-- Page Title -->

  <div class="mb-8">
    <h1 class="text-4xl font-bold text-primary">Settings</h1>

    <p class="text-gray-600 mt-2">Manage basic hospital system settings and configurations.</p>
  </div>

  <!-- Hospital Information -->

  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
    <!-- Card Title -->

    <div class="flex items-center gap-3 border-b pb-5">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-7 h-7 text-primary"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3 21h18M5 21V7l7-4 7 4v14M9 11h.01M15 11h.01M9 15h.01M15 15h.01"
        />
      </svg>

      <h2 class="text-2xl font-semibold">Hospital Information</h2>
    </div>

    <!-- Content -->

    <div class="grid lg:grid-cols-2 gap-10 mt-8">
      <!-- Left -->

      <div class="space-y-6">
        <!-- Hospital Name -->

        <div>
          <label class="block mb-2 font-medium"> Hospital Name </label>

          <input
            type="text"
            value="St. Metropolitan General Hospital"
            class="w-full rounded-xl border border-gray-300 p-3 focus:ring-2 focus:ring-primary outline-none"
          />
        </div>

        <!-- Email -->

        <div>
          <label class="block mb-2 font-medium"> Hospital Email </label>

          <input
            type="email"
            value="admin@metropolitan.med"
            class="w-full rounded-xl border border-gray-300 p-3 focus:ring-2 focus:ring-primary outline-none"
          />
        </div>

        <!-- Phone -->

        <div>
          <label class="block mb-2 font-medium"> Hospital Phone </label>

          <input
            type="text"
            value="+1 (555) 012-3456"
            class="w-full rounded-xl border border-gray-300 p-3 focus:ring-2 focus:ring-primary outline-none"
          />
        </div>

        <!-- Address -->

        <div>
          <label class="block mb-2 font-medium"> Hospital Address </label>

          <textarea
            rows="4"
            class="w-full rounded-xl border border-gray-300 p-3 resize-none focus:ring-2 focus:ring-primary outline-none"
          >
123 Clinical Way, Healthcare District, North Wing,
Metropolis City.</textarea>
        </div>
      </div>

      <!-- Upload Logo -->

      <div>
        <div
          class="border-2 border-dashed border-gray-300 rounded-2xl h-full min-h-[420px] flex flex-col justify-center items-center text-center p-8"
        >
          <div class="w-32 h-32 rounded-full bg-gray-100 flex items-center justify-center text-6xl">
            📷
          </div>

          <h3 class="mt-6 text-xl font-semibold">Hospital Logo</h3>

          <p class="text-gray-500 mt-2">Supported formats: PNG, JPG (max. 2MB)</p>

          <button
            class="mt-8 border-2 border-primary text-primary px-8 py-3 rounded-xl hover:bg-primary hover:text-white transition"
          >
            Upload New Logo
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- =========================
     Application Preferences
========================= -->

  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 mt-8">
    <!-- Title -->

    <div class="flex items-center gap-3 border-b pb-5">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-7 h-7 text-primary"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 4H6a2 2 0 00-2 2v4m12-6h2a2 2 0 012 2v4M4 14v4a2 2 0 002 2h4m6-6v4a2 2 0 01-2 2h-4"
        />
      </svg>

      <h2 class="text-2xl font-semibold">Application Preferences</h2>
    </div>

    <!-- Email Notification -->

    <div class="flex justify-between items-center py-6 border-b">
      <div>
        <h3 class="font-semibold text-lg">Email Notifications</h3>

        <p class="text-gray-500 mt-1">Receive daily clinical reports via email</p>
      </div>

      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" checked class="sr-only peer" />

        <div
          class="w-12 h-7 bg-gray-300 rounded-full peer peer-checked:bg-primary after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"
        ></div>
      </label>
    </div>

    <!-- System Notification -->

    <div class="flex justify-between items-center py-6">
      <div>
        <h3 class="font-semibold text-lg">System Notifications</h3>

        <p class="text-gray-500 mt-1">Allow pop-up alerts in the browser</p>
      </div>

      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" checked class="sr-only peer" />

        <div
          class="w-12 h-7 bg-gray-300 rounded-full peer peer-checked:bg-primary after:content-[''] after:absolute after:top-1 after:left-1 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-5"
        ></div>
      </label>
    </div>
  </div>

  <!-- =========================
      Footer Buttons
========================= -->

  <div class="flex flex-col sm:flex-row justify-end gap-4 mt-8 mb-10">
    <button class="px-8 py-3 rounded-xl border border-gray-300 hover:bg-gray-100 transition">
      Reset
    </button>

    <button class="px-8 py-3 rounded-xl bg-primary text-white hover:opacity-90 transition">
      Save Changes
    </button>
  </div>
</div>
