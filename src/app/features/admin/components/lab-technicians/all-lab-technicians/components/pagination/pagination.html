<div class="flex items-center justify-between px-6 py-4">


  <!-- Showing -->
  <p class="text-sm text-gray-500">
    Showing
    <span class="font-semibold text-gray-700">
      1-10
    </span>
    of
    <span class="font-semibold text-gray-700">
      42
    </span>
    technicians
  </p>



  <!-- Pagination buttons -->
  <div class="flex items-center gap-2">


    <button (click)="previous()" [disabled]="currentPage === 1" class="page-btn">

      Previous

    </button>



    @for(page of pages; track page){

    <button (click)="changePage(page)" class="number-btn" [class.active]="page === currentPage">

      {{page}}

    </button>

    }



    <button (click)="next()" [disabled]="currentPage === totalPages" class="page-btn">

      Next

    </button>


  </div>


</div>
