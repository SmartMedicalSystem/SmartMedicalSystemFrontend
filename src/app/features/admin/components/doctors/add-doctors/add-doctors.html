<div class=" bg-neutral min-h-screen">
  <h1 class="text-2xl font-semibold text-primary mb-2">Add New Doctor</h1>
  <p class="text-gray-500 mb-5">
    Register a new medical professional and create a hospital system account.
  </p>

  <form [formGroup]="form" class="bg-white border border-gray-200 rounded-xl overflow-hidden">
    <!-- ===================== Profile Identity ===================== -->

    <div class="p-6">
      <!-- ===================== Personal Information ===================== -->
      <div class="flex items-center gap-2 mb-5">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 text-primary"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="8" r="4" />
          <path stroke-linecap="round" d="M4 20c0-4 3.6-6 8-6s8 2 8 6" />
        </svg>
        <h2 class="font-semibold text-gray-800">Personal Information</h2>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-gray-500">First Name</label>
          <input
            type="text"
            formControlName="firstName"
            placeholder="e.g. John"
            class="border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2"
            [class.border-gray-200]="!isInvalid('firstName')"
            [class.focus:ring-primary/40]="!isInvalid('firstName')"
            [class.border-tertiary]="isInvalid('firstName')"
            [class.focus:ring-tertiary/30]="isInvalid('firstName')"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-gray-500">Last Name</label>
          <input
            type="text"
            formControlName="lastName"
            placeholder="e.g. Doe"
            class="border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2"
            [class.border-gray-200]="!isInvalid('lastName')"
            [class.focus:ring-primary/40]="!isInvalid('lastName')"
            [class.border-tertiary]="isInvalid('lastName')"
            [class.focus:ring-tertiary/30]="isInvalid('lastName')"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-gray-500">Gender</label>
          <select
            formControlName="gender"
            class="border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40"
          >
            <option value="" disabled selected>Select Gender</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-gray-500">Date of Birth</label>
          <input
            type="date"
            formControlName="dateOfBirth"
            class="border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40"
          />
        </div>

        <!-- <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-gray-500">National ID / SSN</label>
          <input
            type="text"
            formControlName="nationalId"
            placeholder="000-00-0000"
            class="border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2"
            [class.border-gray-200]="!isInvalid('nationalId')"
            [class.focus:ring-primary/40]="!isInvalid('nationalId')"
            [class.border-tertiary]="isInvalid('nationalId')"
            [class.focus:ring-tertiary/30]="isInvalid('nationalId')"
          />
        </div> -->
      </div>

      <hr class="border-gray-100 my-7" />

      <!-- ===================== Professional Information ===================== -->
      <div class="flex items-center gap-2 mb-5">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 text-primary"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="4" y="7" width="16" height="12" rx="2" />
          <path stroke-linecap="round" d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2" />
        </svg>
        <h2 class="font-semibold text-gray-800">Professional Information</h2>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-gray-500">Department</label>
          <div class="relative">
            <input
              type="text"
              formControlName="department"
              placeholder="Search Dept..."
              class="w-full border rounded-lg px-3 py-2.5 pr-9 text-sm focus:outline-none focus:ring-2"
              [class.border-gray-200]="!isInvalid('department')"
              [class.focus:ring-primary/40]="!isInvalid('department')"
              [class.border-tertiary]="isInvalid('department')"
              [class.focus:ring-tertiary/30]="isInvalid('department')"
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="7" />
              <path stroke-linecap="round" d="M21 21l-4.3-4.3" />
            </svg>
          </div>
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-gray-500">Specialization</label>
          <div class="relative">
            <input
              type="text"
              formControlName="specialization"
              placeholder="Search Specialization..."
              class="w-full border rounded-lg px-3 py-2.5 pr-9 text-sm focus:outline-none focus:ring-2"
              [class.border-gray-200]="!isInvalid('specialization')"
              [class.focus:ring-primary/40]="!isInvalid('specialization')"
              [class.border-tertiary]="isInvalid('specialization')"
              [class.focus:ring-tertiary/30]="isInvalid('specialization')"
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="7" />
              <path stroke-linecap="round" d="M21 21l-4.3-4.3" />
            </svg>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-gray-500">Joining Date</label>
          <input
            type="date"
            formControlName="joiningDate"
            class="border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40"
          />
        </div>
      </div>

      <hr class="border-gray-100 my-7" />

      <!-- ===================== Contact Information ===================== -->
      <div class="flex items-center gap-2 mb-5">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 text-primary"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.362 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0122 16.92z"
          />
        </svg>
        <h2 class="font-semibold text-gray-800">Contact Information</h2>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-gray-500">Mobile Number</label>
          <input
            type="text"
            formControlName="mobileNumber"
            placeholder="+1 (555) 000-0000"
            class="border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2"
            [class.border-gray-200]="!isInvalid('mobileNumber')"
            [class.focus:ring-primary/40]="!isInvalid('mobileNumber')"
            [class.border-tertiary]="isInvalid('mobileNumber')"
            [class.focus:ring-tertiary/30]="isInvalid('mobileNumber')"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-gray-500">Personal Email</label>
          <input
            type="email"
            formControlName="personalEmail"
            placeholder="personal@email.com"
            class="border rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2"
            [class.border-gray-200]="!isInvalid('personalEmail')"
            [class.focus:ring-primary/40]="!isInvalid('personalEmail')"
            [class.border-tertiary]="isInvalid('personalEmail')"
            [class.focus:ring-tertiary/30]="isInvalid('personalEmail')"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-4"></div>
    </div>

    <!-- ===================== Account Delivery ===================== -->
    <div class="p-6"></div>
    <!-- ===================== Footer actions ===================== -->
    <div
      class="bg-neutral border-t border-gray-100 px-6 py-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4"
    >
      <button
        type="button"
        (click)="onClearForm()"
        class="flex items-center gap-2 text-gray-500 hover:text-gray-700 text-sm font-medium"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 3l18 18M10 5H6a2 2 0 00-2 2v10a2 2 0 002 2h9a2 2 0 002-2v-4"
          />
        </svg>
        Clear Form
      </button>

      <div class="flex flex-wrap justify-end gap-3">
        <button
          type="button"
          (click)="onCancel()"
          class="px-6 py-2.5 rounded-lg text-gray-700 font-medium hover:bg-gray-100 transition"
        >
          Cancel
        </button>

        <button
          type="button"
          (click)="onCreateDoctor()"
          class="flex items-center gap-2 px-6 py-2.5 rounded-lg bg-primary text-white font-medium hover:bg-primary/90 transition"
        >
          Create Doctor
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>
  </form>
</div>
